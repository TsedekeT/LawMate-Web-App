<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LawMate - login</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <!-- Header Section -->
    <header>
      <div class="container">
        <div class="logo">
          <img
            src="../assets/img/photo_2024-12-27_15-10-59.jpg "
            style="border-radius: 50%"
            alt=" Logo Here"
          />
        </div>
        <nav>
          <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="signup.html">Sign Up</a></li>
            <li><a href="login.html">Login</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Login Section -->
    <section class="login-section" id="login">
      <div class="container">
        <div class="left-sidel">
          <img
            src="../assets/img/justice-2755765_1280.jpg"
            alt="Login Background"
          />
        </div>

        <div class="right-side">
          <form id="loginForm">
            <h2>Login</h2>

            <!-- User Type Dropdown -->
            <div class="user-type">
              <label for="userType">I am a:</label>
              <select id="userType" class="input-field" required>
                <option value="" disabled selected>Select your role</option>
                <option value="client">Client</option>
                <option value="lawyer">Lawyer</option>
              </select>
            </div>

            <input
              type="email"
              id="email"
              class="input-field"
              placeholder="Enter your Email"
              required
            />
            <input
              type="password"
              id="password"
              class="input-field"
              placeholder="Enter your Password"
              required
            />

            <button type="submit" class="btn">Login</button>

            <div class="third-party-login">
              <button type="button" class="icon-btn">
                <img
                  src="../assets/img/icons8-google-50.png"
                  alt="Google Logo"
                />
                Login with Google
              </button>
              <button type="button" class="icon-btn">
                <img
                  src="../assets/img/icons8-facebook-logo-50.png"
                  alt="Facebook Logo"
                />
                Login with Facebook
              </button>
              <button type="button" class="icon-btn">
                <img
                  src="../assets/img/icons8-linkedin-logo-50.png"
                  alt="LinkedIn Logo"
                />
                Login with LinkedIn
              </button>
            </div>

            <div class="redirect-link">
              <p>Don't have an account? <a href="#signup">Sign Up here</a></p>
            </div>
          </form>
        </div>
      </div>
    </section>

    <!-- Footer Section -->
    <footer>
      <p>&copy; 2024 LawMate. All rights reserved.</p>
    </footer>
    <script src="../js/script.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
